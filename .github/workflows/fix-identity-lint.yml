name: Temporary identity lint fixer

on:
  push:
    branches: [phase2/identity-engine-foundation-v2]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: phase2/identity-engine-foundation-v2
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.13"
      - run: uv sync --locked --dev
      - name: Wrap known long lines
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runner = Path('scripts/run_tiingo_identity_engine.py')
          text = runner.read_text(encoding='utf-8')
          text = text.replace(
              'This command is intentionally metadata-only: it reads the durable Tiingo profile and current reviewed\n'
              'identity candidate, collects independent SEC evidence, checkpoints every completed symbol, and writes\n',
              'This command is intentionally metadata-only. It reads the durable Tiingo profile and the current\n'
              'reviewed identity candidate, collects independent SEC evidence, checkpoints every completed symbol,\n'
              'and writes a deterministic READY/DEFER report. It never calls Tiingo and never mutates canonical data.\n'
          )
          text = text.replace(
              'a deterministic READY/DEFER report. It never calls Tiingo and never mutates canonical data.\n',
              '',
              1,
          )
          runner.write_text(text, encoding='utf-8')

          tests = Path('tests/unit/data/providers/test_identity_engine.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              '        "<html>Our common stock began trading on Nasdaq under the symbol TEST on January 2, 2020.</html>"\n',
              '        "<html>Our common stock began trading on Nasdaq under the symbol TEST "\n'
              '        "on January 2, 2020.</html>"\n',
          )
          text = text.replace(
              '        "<html>Test Corp common stock, symbol TEST, is listed on the New York Stock Exchange.</html>"\n',
              '        "<html>Test Corp common stock, symbol TEST, is listed on the "\n'
              '        "New York Stock Exchange.</html>"\n',
          )
          tests.write_text(text, encoding='utf-8')
          PY
      - run: uv run --frozen ruff check --fix tests/unit/data/providers/test_identity_engine.py scripts/run_tiingo_identity_engine.py
      - run: uv run --frozen ruff format scripts/run_tiingo_identity_engine.py tests/unit/data/providers/test_identity_engine.py
      - name: Commit lint fixes when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run_tiingo_identity_engine.py tests/unit/data/providers/test_identity_engine.py
          git commit -m "Fix identity engine lint"
          git push origin HEAD:phase2/identity-engine-foundation-v2
