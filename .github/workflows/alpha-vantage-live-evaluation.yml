name: Alpha Vantage Live Evaluation

on:
  workflow_dispatch:
    inputs:
      delay_seconds:
        description: "Pause between completed evaluation tasks to reduce provider throttling risk"
        required: false
        default: "15"

concurrency:
  group: alpha-vantage-live-evaluation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      ALPHA_VANTAGE_EVALUATION_DELAY_SECONDS: ${{ inputs.delay_seconds }}
      TRADE_SCOUT_EVALUATION_ROOT: runtime/alpha-vantage-evaluation
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.13"

      - name: Sync locked environment
        run: uv sync --locked --dev

      - name: Confirm evaluation secret is configured
        run: |
          if [[ -z "$ALPHA_VANTAGE_API_KEY" ]]; then
            echo "ALPHA_VANTAGE_API_KEY repository secret is not configured" >&2
            exit 1
          fi

      - name: Run bounded Alpha Vantage provider evaluation
        run: uv run --frozen python scripts/run_alpha_vantage_live_evaluation.py

      - name: Publish evaluation summary
        if: always()
        run: |
          report="runtime/alpha-vantage-evaluation/report/alpha-vantage-live-evaluation.md"
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evaluation report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-vantage-live-evaluation-report
          path: runtime/alpha-vantage-evaluation/report/
          if-no-files-found: error
          retention-days: 30
