name: Quality Fix

on:
  push:
    branches: [phase-1/quality-expansion]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.13"
      - name: Apply deterministic quality fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/trade_scout/data/context_quality.py')
          text = path.read_text()
          text = text.replace(
              'from datetime import date\n',
              'from datetime import date\nfrom itertools import pairwise\n',
          )
          text = text.replace(
              'for previous, current in zip(ordered, ordered[1:], strict=False):',
              'for previous, current in pairwise(ordered):',
          )
          path.write_text(text)
          PY
          uv sync --locked --dev
          uv run --frozen ruff check --fix .
          uv run --frozen ruff format .
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/trade_scout/data/context_quality.py tests/unit/data/test_context_quality.py src/trade_scout/data/__init__.py
          git commit -m "style: normalize contextual quality checks"
          git push
