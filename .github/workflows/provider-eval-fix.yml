name: Provider Eval Fix

on:
  push:
    branches: [phase-1/provider-evaluation-harness]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.13"
      - name: Format provider evaluation slice
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/trade_scout/data/provider_evaluation.py')
          text = path.read_text()
          text = text.replace(
              '            "run the sample on real historical active, inactive, corporate-action, and symbol-change cases",\n',
              '            "run the agreed real historical sample across active, inactive, corporate-action, "\n            "and symbol-change cases",\n',
          )
          path.write_text(text)
          PY
          uv sync --locked --dev
          uv run --frozen ruff format src/trade_scout/data/provider_evaluation.py tests/integration/data/test_provider_evaluation.py
          uv run --frozen ruff check --fix src/trade_scout/data/provider_evaluation.py tests/integration/data/test_provider_evaluation.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/trade_scout/data/provider_evaluation.py tests/integration/data/test_provider_evaluation.py
          git commit -m "style: format provider evaluation harness"
          git push
