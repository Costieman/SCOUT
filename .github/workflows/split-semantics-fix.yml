name: Split Semantics Fix

on:
  push:
    branches: [phase-1/split-adjustment-semantics]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.13"
      - name: Align provider and canonical semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          tiingo = Path('src/trade_scout/data/providers/tiingo.py')
          text = tiingo.read_text()
          text = text.replace(
              '                "EOD splitFactor cannot distinguish all detailed corporate-action subtypes",\n',
              '                "EOD splitFactor is event evidence, not a cumulative split-price multiplier",\n'
              '                "EOD splitFactor cannot distinguish all detailed corporate-action subtypes",\n',
          )
          text = text.replace(
              '                        split_factor=_require_number(row, "splitFactor"),\n',
              '                        split_factor=None,\n',
              1,
          )
          tiingo.write_text(text)

          tests = Path('tests/integration/data/test_tiingo_secondary_adapter.py')
          test_text = tests.read_text()
          test_text = test_text.replace(
              '    assert second.split_factor == 2.0\n',
              '    assert second.split_factor is None\n',
          )
          test_text = test_text.replace(
              '    assert second.adjusted_open is None\n',
              '    assert second.adjusted_open is None\n'
              '    assert any("cumulative" in item for item in adapter.describe_capabilities().known_limitations)\n',
          )
          tests.write_text(test_text)

          contracts = Path('src/trade_scout/data/contracts.py')
          contract_text = contracts.read_text()
          contract_text = contract_text.replace(
              '    split_factor: float\n',
              '    split_factor: float\n    # Cumulative split-only price multiplier: split-adjusted OHLC = raw OHLC * factor.\n',
              1,
          )
          contracts.write_text(contract_text)

          provider = Path('src/trade_scout/data/provider.py')
          provider_text = provider.read_text()
          provider_text = provider_text.replace(
              '    split_factor: float | None = None\n',
              '    # Cumulative split-only price multiplier, not the event-date split ratio.\n'
              '    split_factor: float | None = None\n',
              1,
          )
          provider.write_text(provider_text)

          readme = Path('src/trade_scout/data/providers/TIINGO_SECONDARY_ADAPTER.md')
          readme_text = readme.read_text()
          readme_text = readme_text.replace(
              'The EOD `splitFactor` and `divCash` fields are preserved as provider evidence. Non-unit `splitFactor` and non-zero `divCash` observations also create provider-neutral validation corporate-action records. The current EOD factor cannot distinguish every detailed split/stock-distribution subtype, which remains an explicit limitation rather than being guessed.\n',
              'The EOD `splitFactor` and `divCash` fields are preserved as provider evidence. Non-unit `splitFactor` and non-zero `divCash` observations also create provider-neutral validation corporate-action records. The Tiingo event-date `splitFactor` is deliberately **not** copied into Trade Scout `ProviderDailyBar.split_factor`, because the Trade Scout field is the cumulative split-only price multiplier for that observation. The current EOD factor cannot distinguish every detailed split/stock-distribution subtype, which remains an explicit limitation rather than being guessed.\n',
          )
          readme.write_text(readme_text)
          PY
          uv sync --locked --dev
          uv run --frozen ruff format src/trade_scout/data/contracts.py src/trade_scout/data/provider.py src/trade_scout/data/providers/tiingo.py tests/integration/data/test_tiingo_secondary_adapter.py
          uv run --frozen ruff check --fix src/trade_scout/data/contracts.py src/trade_scout/data/provider.py src/trade_scout/data/providers/tiingo.py tests/integration/data/test_tiingo_secondary_adapter.py
          uv run --frozen mypy src/trade_scout
          uv run --frozen pytest tests/integration/data/test_tiingo_secondary_adapter.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/trade_scout/data/contracts.py src/trade_scout/data/provider.py src/trade_scout/data/providers/tiingo.py src/trade_scout/data/providers/TIINGO_SECONDARY_ADAPTER.md tests/integration/data/test_tiingo_secondary_adapter.py
          git commit -m "fix(data): disambiguate split adjustment factors"
          git push
