name: Stooq transport probe

on:
  push:
    branches:
      - phase1/ab-stage1-live-campaign
    paths:
      - campaigns/stooq_probe_trigger.txt

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.13"
      - name: Probe Stooq transport
        run: uv run python scripts/probe_stooq_transport.py
