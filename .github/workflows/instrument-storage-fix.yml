name: Instrument Storage Fix

on:
  push:
    branches: [phase-1/instrument-master-storage]
    paths:
      - ".github/workflows/instrument-storage-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.13"
      - name: Format, persist, and validate instrument storage
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/trade_scout/data/instrument_storage.py')
          text = path.read_text()
          text = text.replace(
              '        instrument_count=int(row[6]),\n'
              '        symbol_history_count=int(row[7]),\n',
              '        instrument_count=_required_int(row[6], "instrument_count"),\n'
              '        symbol_history_count=_required_int(row[7], "symbol_history_count"),\n',
          )
          if 'def _required_int(value: object, field: str) -> int:' not in text:
              marker = '\ndef _required_date(value: object) -> date:\n'
              helper = (
                  '\ndef _required_int(value: object, field: str) -> int:\n'
                  '    if not isinstance(value, int) or isinstance(value, bool):\n'
                  '        raise InstrumentMasterIntegrityError(f"registered {field} is invalid")\n'
                  '    return value\n'
              )
              text = text.replace(marker, helper + marker)
          path.write_text(text)
          PY
          uv sync --locked --dev
          uv run --frozen ruff format src/trade_scout/data/instrument_storage.py tests/integration/data/test_instrument_storage.py
          uv run --frozen ruff check --fix src/trade_scout/data/instrument_storage.py tests/integration/data/test_instrument_storage.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/trade_scout/data/instrument_storage.py tests/integration/data/test_instrument_storage.py
            git commit -m "fix(data): type instrument-master registry values"
            git push
          fi
          uv run --frozen mypy src/trade_scout
          uv run --frozen pytest
