name: Instrument Storage Fix

on:
  push:
    branches: [phase-1/instrument-master-storage]
    paths:
      - ".github/workflows/instrument-storage-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.13"
      - name: Store timezone-aware registry timestamps as ISO text
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/trade_scout/data/instrument_storage.py')
          text = path.read_text()
          text = text.replace(
              '                    manifest.created_at,\n',
              '                    manifest.created_at.isoformat(),\n',
          )
          text = text.replace(
              '                    datetime.now(manifest.created_at.tzinfo),\n',
              '                    datetime.now(manifest.created_at.tzinfo).isoformat(),\n',
          )
          text = text.replace('created_at TIMESTAMPTZ NOT NULL,', 'created_at VARCHAR NOT NULL,')
          text = text.replace('registered_at TIMESTAMPTZ NOT NULL', 'registered_at VARCHAR NOT NULL')
          text = text.replace(
              '    created_at = row[2]\n'
              '    if not isinstance(created_at, datetime):\n'
              '        raise InstrumentMasterIntegrityError("registered created_at is invalid")\n',
              '    try:\n'
              '        created_at = datetime.fromisoformat(str(row[2]))\n'
              '    except ValueError as exc:\n'
              '        raise InstrumentMasterIntegrityError("registered created_at is invalid") from exc\n'
              '    if created_at.tzinfo is None or created_at.utcoffset() is None:\n'
              '        raise InstrumentMasterIntegrityError("registered created_at is not timezone-aware")\n',
          )
          path.write_text(text)
          PY
          uv sync --locked --dev
          uv run --frozen ruff format src/trade_scout/data/instrument_storage.py tests/integration/data/test_instrument_storage.py
          uv run --frozen ruff check --fix src/trade_scout/data/instrument_storage.py tests/integration/data/test_instrument_storage.py
          uv run --frozen mypy src/trade_scout
          uv run --frozen pytest
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/trade_scout/data/instrument_storage.py tests/integration/data/test_instrument_storage.py
            git commit -m "fix(data): store registry timestamps as ISO text"
            git push
          fi
