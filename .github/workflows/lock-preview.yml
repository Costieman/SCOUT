name: Lock Preview

on:
  push:
    branches: [phase-1/canonical-storage]

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.13"
      - name: Resolve lockfile
        run: |
          uv lock
          echo '---UV_LOCK_BEGIN---'
          cat uv.lock
          echo '---UV_LOCK_END---'
