name: Revision Fix

on:
  push:
    branches: [phase-1/incremental-revisions]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.13"
      - name: Format revision slice
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/trade_scout/data/revisions.py')
          text = path.read_text()
          text = text.replace(
              '    """Raised when an incremental revision request is ambiguous or violates the correction window."""\n',
              '    """Raised when an incremental revision request is ambiguous or outside policy."""\n',
          )
          text = text.replace(
              '    """Append new observations and replace only explicit incoming keys inside the correction window."""\n',
              '    """Append new observations and replace explicit keys inside the correction window."""\n',
          )
          text = text.replace(
              '                f"incoming bars use {incoming_version}; expected target version {target_dataset_version}"\n',
              '                f"incoming bars use {incoming_version}; expected target version "\n                f"{target_dataset_version}"\n',
          )
          path.write_text(text)
          PY
          uv sync --locked --dev
          uv run --frozen ruff format src/trade_scout/data/revisions.py tests/unit/data/test_revisions.py
          uv run --frozen ruff check --fix src/trade_scout/data/revisions.py tests/unit/data/test_revisions.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/trade_scout/data/revisions.py tests/unit/data/test_revisions.py
          git commit -m "style: format incremental revisions"
          git push
