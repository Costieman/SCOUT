name: Revision Fix

on:
  push:
    branches: [phase-1/incremental-revisions]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.13"
      - name: Format revision slice
        run: |
          uv sync --locked --dev
          uv run --frozen ruff format src/trade_scout/data/revisions.py tests/unit/data/test_revisions.py
          uv run --frozen ruff check --fix src/trade_scout/data/revisions.py tests/unit/data/test_revisions.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/trade_scout/data/revisions.py tests/unit/data/test_revisions.py
          git commit -m "style: format incremental revisions"
          git push
