name: Storage Fix

on:
  push:
    branches: [phase-1/canonical-storage]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Apply narrow source fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/trade_scout/data/__init__.py')
          text = path.read_text()
          text = text.replace(
              'validation, reconciliation, and immutable canonical storage. It does not calculate research features,\n',
              'validation, reconciliation, and immutable canonical storage. It does not calculate research\nfeatures,\n',
          )
          path.write_text(text)

          path = Path('src/trade_scout/data/canonical_storage.py')
          text = path.read_text()
          text = text.replace(
              '                    f"registered dataset {request.dataset_version} is missing its canonical directory"\n',
              '                    f"registered dataset {request.dataset_version} is missing "\n                    "its canonical directory"\n',
          )
          text = text.replace(
              '                f"dataset version {request.dataset_version} already exists with different content or provenance"\n',
              '                f"dataset version {request.dataset_version} already exists with different "\n                "content or provenance"\n',
          )
          path.write_text(text)
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/trade_scout/data/__init__.py src/trade_scout/data/canonical_storage.py
          git commit -m "style: satisfy data storage lint"
          git push
