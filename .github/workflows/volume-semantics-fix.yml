name: Volume Semantics Fix

on:
  push:
    branches: [phase-1/real-massive-evaluation]
    paths:
      - ".github/workflows/volume-semantics-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.13"
      - name: Preserve fractional provider volume through canonical contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/trade_scout/data/provider.py'): [
                  ('    volume: int\n', '    volume: float\n'),
              ],
              Path('src/trade_scout/data/contracts.py'): [
                  ('    volume_raw: int\n', '    volume_raw: float\n'),
                  ('    volume: int\n', '    volume: float\n'),
              ],
              Path('src/trade_scout/data/canonical_storage.py'): [
                  ('                    volume_raw BIGINT NOT NULL,\n', '                    volume_raw DOUBLE NOT NULL,\n'),
                  ('        volume_raw=_require_int(row[6]),\n', '        volume_raw=_require_float(row[6]),\n'),
              ],
              Path('src/trade_scout/data/reconciliation.py'): [
                  ('    volume_absolute: int = 0\n', '    volume_absolute: float = 0.0\n'),
                  ('    primary: int,\n    secondary: int,\n', '    primary: float,\n    secondary: float,\n'),
              ],
              Path('src/trade_scout/data/providers/massive.py'): [
                  ('                        volume=_require_integral_number(raw_row, "v"),\n', '                        volume=_require_number(raw_row, "v"),\n'),
              ],
          }
          for path, changes in replacements.items():
              text = path.read_text()
              for old, new in changes:
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          uv sync --locked --dev
          uv run --frozen ruff format .
          uv run --frozen ruff check --fix .
          uv run --frozen mypy src/trade_scout
          uv run --frozen pytest
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/trade_scout/data/provider.py src/trade_scout/data/contracts.py \
            src/trade_scout/data/canonical_storage.py src/trade_scout/data/reconciliation.py \
            src/trade_scout/data/providers/massive.py
          git commit -m "fix(data): preserve fractional share volume"
          git push
