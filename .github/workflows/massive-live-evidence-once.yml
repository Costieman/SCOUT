name: Massive Live Evidence Once

on:
  push:
    branches: [phase-1/massive-live-evidence-v3]

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      TRADE_SCOUT_EVALUATION_ROOT: runtime/massive-evaluation
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.13"
      - run: uv sync --locked --dev
      - name: Confirm credential
        run: |
          if [[ -z "$MASSIVE_API_KEY" ]]; then
            echo "MASSIVE_API_KEY repository secret is not configured" >&2
            exit 1
          fi
      - name: Run evidence sample with current transport
        run: uv run --frozen python scripts/run_massive_live_evaluation.py
      - name: Publish summary
        if: always()
        run: |
          report="runtime/massive-evaluation/report/massive-live-evaluation.md"
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: massive-live-evidence-v3-report
          path: runtime/massive-evaluation/report/
          if-no-files-found: error
          retention-days: 30
