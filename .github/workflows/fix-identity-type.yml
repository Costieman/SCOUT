name: Temporary identity type fixer

on:
  push:
    branches: [phase2/identity-engine-foundation-v2]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: phase2/identity-engine-foundation-v2
      - name: Fix SEC response typing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/trade_scout/data/providers/sec_identity.py')
          text = path.read_text(encoding='utf-8')
          old = '''                with urllib.request.urlopen(request, timeout=self._timeout_seconds) as response:
                    return response.read().decode("utf-8", errors="replace")
'''
          new = '''                with urllib.request.urlopen(request, timeout=self._timeout_seconds) as response:
                    payload = response.read()
                    if not isinstance(payload, bytes):
                        raise SecIdentityEvidenceError("SEC response body is not bytes")
                    return payload.decode("utf-8", errors="replace")
'''
          if old not in text:
              raise SystemExit('expected SEC response block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/trade_scout/data/providers/sec_identity.py
          git commit -m "Fix SEC response typing"
          git push origin HEAD:phase2/identity-engine-foundation-v2
