name: Tiingo manifesto evaluation

on:
  push:
    branches:
      - phase1/tiingo-manifesto-evaluation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.13"
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run credential-backed Tiingo manifesto evaluation
        env:
          TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
        run: uv run python scripts/run_tiingo_manifesto_evaluation.py
      - name: Upload derived evaluation report only
        uses: actions/upload-artifact@v4
        with:
          name: tiingo-manifesto-evaluation
          path: runtime/tiingo-manifesto-evaluation/report.json
          if-no-files-found: error
          retention-days: 14
