name: Corporate Action Fix

on:
  push:
    branches: [phase-1/corporate-action-foundation]
    paths:
      - ".github/workflows/corporate-action-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.13"
      - name: Format and validate corporate-action slice
        run: |
          uv sync --locked --dev
          uv run --frozen ruff format src/trade_scout/data/corporate_actions.py \
            src/trade_scout/data/corporate_action_storage.py \
            tests/integration/data/test_corporate_action_foundation.py
          uv run --frozen ruff check --fix src/trade_scout/data/corporate_actions.py \
            src/trade_scout/data/corporate_action_storage.py \
            tests/integration/data/test_corporate_action_foundation.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/trade_scout/data/corporate_actions.py \
              src/trade_scout/data/corporate_action_storage.py \
              tests/integration/data/test_corporate_action_foundation.py
            git commit -m "style: format corporate-action foundation"
            git push
          fi
          uv run --frozen mypy src/trade_scout
          uv run --frozen pytest
