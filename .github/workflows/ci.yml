name: CI

on:
  push:
    branches: [main, phase-0b/repository-bootstrap]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.13"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked --dev

      - name: Check repository hygiene
        shell: bash
        run: |
          secret_files="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          data_files="$(git ls-files | grep -E '^(runtime|data|cache|logs|artifacts|outputs)/|\.(duckdb|parquet)$|\.duckdb\.wal$' || true)"
          if [[ -n "${secret_files}${data_files}" ]]; then
            echo "Forbidden runtime, data, or secret-bearing files are tracked:"
            printf '%s\n%s\n' "$secret_files" "$data_files"
            exit 1
          fi

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Diagnose import ordering
        run: uv run --frozen ruff check --select I --fix --diff tests/unit/data/test_provider_complementarity.py || true

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type check
        run: uv run --frozen mypy src/trade_scout

      - name: Test
        run: uv run --frozen pytest
