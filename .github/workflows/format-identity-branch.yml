name: Temporary identity branch formatter

on:
  push:
    branches: [phase2/identity-engine-foundation-v2]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: phase2/identity-engine-foundation-v2
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.13"
      - run: uv sync --locked --dev
      - run: uv run --frozen ruff format src/trade_scout/data/providers/sec_identity.py
      - name: Commit formatter output when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/trade_scout/data/providers/sec_identity.py
          git commit -m "Format SEC identity provider"
          git push origin HEAD:phase2/identity-engine-foundation-v2
