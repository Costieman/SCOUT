name: Backfill Fix

on:
  push:
    branches: [phase-1/backfill-orchestration]
    paths:
      - ".github/workflows/backfill-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.13"
      - name: Fix and validate backfill slice
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/trade_scout/data/backfill.py')
          text = path.read_text()
          text = text.replace(
              '            f"adapter provider {adapter.provider_id} does not match plan provider {plan.provider_id}"\n',
              '            f"adapter provider {adapter.provider_id} does not match plan provider "\n'
              '            f"{plan.provider_id}"\n',
          )
          text = text.replace(
              '                f"batch {batch.batch_id} returned provider {bar.provider_id}; expected {provider_id}"\n',
              '                f"batch {batch.batch_id} returned provider {bar.provider_id}; "\n'
              '                f"expected {provider_id}"\n',
          )
          text = text.replace(
              'def _optional_float(value: object) -> float | None:\n'
              '    return None if value is None else float(value)\n',
              'def _optional_float(value: object) -> float | None:\n'
              '    if value is None:\n'
              '        return None\n'
              '    if not isinstance(value, int | float) or isinstance(value, bool):\n'
              '        raise BackfillRuntimeConflictError("staged numeric field is invalid")\n'
              '    return float(value)\n',
          )
          path.write_text(text)
          PY
          uv sync --locked --dev
          uv run --frozen ruff format .
          uv run --frozen ruff check --fix .
          uv run --frozen mypy src/trade_scout
          uv run --frozen pytest
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/trade_scout/data/backfill.py tests/unit/data/test_backfill.py
          git commit -m "fix(data): satisfy backfill quality checks"
          git push
